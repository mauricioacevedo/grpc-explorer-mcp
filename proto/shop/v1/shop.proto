syntax = "proto3";

package shop.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/mauricioacevedo/grpc-explorer-mcp/internal/demo/shopv1";

// OrderService manages customer orders for the demo shop.
service OrderService {
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc CreateOrder(CreateOrderRequest) returns (Order);
  // WatchOrders streams status changes. Streaming methods can be described but not called.
  rpc WatchOrders(WatchOrdersRequest) returns (stream Order);
}

// InventoryService exposes stock levels per product.
service InventoryService {
  rpc GetStock(GetStockRequest) returns (Stock);
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_PAID = 2;
  ORDER_STATUS_SHIPPED = 3;
  ORDER_STATUS_CANCELLED = 4;
}

message Money {
  string currency_code = 1;
  int64 units = 2;
  int32 nanos = 3;
}

message LineItem {
  string sku = 1;
  int32 quantity = 2;
  Money unit_price = 3;
}

message Order {
  string id = 1;
  string customer_id = 2;
  repeated LineItem items = 3;
  OrderStatus status = 4;
  Money total = 5;
  google.protobuf.Timestamp created_at = 6;
  map<string, string> labels = 7;
}

message GetOrderRequest {
  string id = 1;
}

message ListOrdersRequest {
  string customer_id = 1;
  OrderStatus status = 2;
  int32 page_size = 3;
}

message ListOrdersResponse {
  repeated Order orders = 1;
}

message CreateOrderRequest {
  string customer_id = 1;
  repeated LineItem items = 2;
}

message WatchOrdersRequest {
  string customer_id = 1;
}

message GetStockRequest {
  string sku = 1;
}

message Stock {
  string sku = 1;
  int32 available = 2;
  oneof location {
    string warehouse = 3;
    string store_id = 4;
  }
}
